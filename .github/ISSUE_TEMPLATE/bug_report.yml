name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Alt+Shift+S
        2. Drag over an area
        3. …
  - type: input
    id: version
    attributes:
      label: Jemur version
      description: Shown in Jemur → About.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, 125% scaling, two monitors
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Settings → Logs → Open folder. Paste the relevant lines from today's file.
      render: text
