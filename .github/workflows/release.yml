name: Release

# Push a tag like v0.2.0 to build and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: v
        shell: pwsh
        run: echo "version=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test Jemur.sln -c Release

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ steps.v.outputs.version }}'
          foreach ($rid in 'win-x64', 'win-arm64') {
            # Small download; needs the .NET 10 Desktop Runtime.
            dotnet publish src/Jemur.csproj -c Release -r $rid --self-contained false -p:Version=$v -p:PublishSingleFile=true -o "out/$rid"
            # No prerequisites; larger download.
            dotnet publish src/Jemur.csproj -c Release -r $rid --self-contained true -p:Version=$v -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "out/$rid-standalone"
            Compress-Archive "out/$rid/*" "Jemur-$v-$rid.zip"
            Compress-Archive "out/$rid-standalone/*" "Jemur-$v-$rid-standalone.zip"
          }
          Get-FileHash Jemur-*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Jemur ${{ steps.v.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            Jemur-*.zip
            SHA256SUMS.txt
